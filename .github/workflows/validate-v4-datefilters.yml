name: Validate V4 date filters
on:
  push:
    paths:
      - '.validate-v4-datefilters'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check fluxo-v4-datefilters.js
          node --check fluxo-v4.js
          node --check fluxo-v4-ui.js
          node --check apps-script/Code.gs
      - name: Cleanup temporary validation files
        run: |
          rm -f .validate-v4-datefilters .github/workflows/validate-v4-datefilters.yml
          git config user.name 'Plansul'
          git config user.email 'yuritas.pessoal@gmail.com'
          git add -A
          git commit -m 'chore: conclui validação filtros v4'
          git push origin HEAD:${{ github.ref_name }}
