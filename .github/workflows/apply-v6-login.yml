name: Apply V6 login
on:
  push:
    paths:
      - '.apply-v6-login'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply login performance and visual changes
        run: |
          python - <<'PY'
          from pathlib import Path
          files=['index.html','diretoria.html']
          font='<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">'
          font_async='''<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">\n<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"></noscript>'''
          old_scripts='''<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>\n<script src="app.js"></script>'''
          new_scripts='''<script src="app.js"></script>\n<script async data-plansul-xlsx="1" src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>\n<script src="login-v6.js"></script>\n<script src="xlsx-v6-loader.js"></script>'''
          theme_boot='''<script>try{document.documentElement.dataset.mobileTheme=localStorage.getItem('plansul-mobile-theme')==='dark'?'dark':'clean'}catch(e){document.documentElement.dataset.mobileTheme='clean'}</script>\n<link rel="stylesheet" href="login-v6.css">'''
          for name in files:
              p=Path(name); s=p.read_text()
              if font in s: s=s.replace(font,font_async,1)
              if 'href="login-v6.css"' not in s:
                  s=s.replace('<link rel="stylesheet" href="styles.css">','<link rel="stylesheet" href="styles.css">\n'+theme_boot,1)
              if old_scripts not in s:
                  raise SystemExit(f'Bloco de scripts esperado não encontrado em {name}')
              s=s.replace(old_scripts,new_scripts,1)
              p.write_text(s)
          PY
      - name: Validate V6
        run: |
          node --check login-v6.js
          node --check xlsx-v6-loader.js
          grep -q 'login-v6.css' index.html
          grep -q 'login-v6.css' diretoria.html
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','diretoria.html']:
              s=Path(name).read_text()
              assert s.index('<script src="app.js"></script>') < s.index('xlsx.full.min.js')
              assert 'async data-plansul-xlsx="1"' in s
          PY
      - name: Commit and cleanup
        run: |
          rm -f .apply-v6-login .github/workflows/apply-v6-login.yml
          git config user.name 'Plansul'
          git config user.email 'yuritas.pessoal@gmail.com'
          git add -A
          git commit -m 'feat: aplica login Plansul V6 e prioriza autenticação'
          git push origin HEAD:${{ github.ref_name }}
