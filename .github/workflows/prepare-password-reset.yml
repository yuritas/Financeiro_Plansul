name: Prepare Password Reset
on:
  push:
    branches: [feature/esqueci-minha-senha]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/esqueci-minha-senha
      - name: Aplicar implementação
        run: |
          python tools/apply-password-reset.py
          python tools/refine-password-reset.py
      - name: Validar sintaxe e contrato
        shell: bash
        run: |
          set -euo pipefail
          cp apps-script/Code.gs /tmp/Code-check.js
          node --check /tmp/Code-check.js
          node --check login-v6.js
          grep -q "case 'requestPasswordReset'" apps-script/Code.gs
          grep -q "case 'verifyResetCode'" apps-script/Code.gs
          grep -q "case 'resetPassword'" apps-script/Code.gs
          grep -q "SHEET_RESET_TOKENS" apps-script/Code.gs
          grep -q "'bloqueadoAte','email'" apps-script/Code.gs
          grep -q "RESET_MAX_ATTEMPTS = 5" apps-script/Code.gs
          grep -q "RESET_CODE_TTL_MINUTES = 10" apps-script/Code.gs
          grep -q "RESET_REQUEST_THROTTLE_SECONDS = 60" apps-script/Code.gs
          grep -q "MailApp.sendEmail" apps-script/Code.gs
          grep -q "bumpUserSessionVersion" apps-script/Code.gs
          grep -q 'id="forgotPasswordBtn"' index.html
          grep -q 'id="forgotPasswordBtn"' diretoria.html
          grep -q 'password-reset.css?v=13' index.html
          grep -q 'password-reset.css?v=13' diretoria.html
          grep -q "requestPasswordReset" login-v6.js
          grep -q "verifyResetCode" login-v6.js
          grep -q "resetPassword" login-v6.js
          grep -q "login-v6.js?v=13" index.html
          grep -q "login-v6.js?v=13" diretoria.html
      - name: Gravar branch pronta e remover temporários
        shell: bash
        run: |
          rm -f tools/apply-password-reset.py tools/refine-password-reset.py .github/workflows/prepare-password-reset.yml
          git config user.name "Plansul"
          git config user.email "yuritas.pessoal@gmail.com"
          git add -A
          git commit -m "feat: adiciona recuperação de senha por e-mail"
          git push origin HEAD:feature/esqueci-minha-senha
