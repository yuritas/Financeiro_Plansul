name: V12 Login Smoke
on:
  push:
    branches: [v12-login-final-e-acesso]
permissions:
  contents: write
jobs:
  smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v12-login-final-e-acesso
      - name: Validar endpoint publicado do Apps Script
        shell: bash
        env:
          ENDPOINT: https://script.google.com/macros/s/AKfycbzhn3VwSmd3DIXNFuKvgIeqtpTk6qdTZKlh1fFyVLxQlTrvrt3WFcFFDtp-rJEzD3lk/exec
        run: |
          set -euo pipefail
          GET_OUT="$(curl -L --fail --silent --show-error --max-time 30 "$ENDPOINT")"
          echo "$GET_OUT" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True and d.get("status")=="online", d'

          # Não use -X POST aqui. O Apps Script responde o POST com redirect para
          # googleusercontent; curl deve poder trocar o método no redirect, assim como fetch().
          POST_OUT="$(curl -L --fail --silent --show-error --max-time 60 "$ENDPOINT" -H 'Content-Type: text/plain;charset=utf-8' --data '{"action":"login","token":null,"username":"__plansul_v12_probe__","password":"__invalid_probe__"}')"
          echo "$POST_OUT" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is False and d.get("error")=="invalid_credentials", d'
      - name: Validar frontend V12
        shell: bash
        run: |
          node --check login-v6.js
          node --check app.js
          node --check dashboard-bridge-v10.js
          grep -q 'data-v12-markup="1"' index.html
          grep -q 'login-v6.js?v=12' index.html
          grep -q 'app.js?v=12' index.html
          test -s assets/login-header-final.webp
      - name: Remover workflow temporário
        shell: bash
        run: |
          rm -f .github/workflows/v12-login-smoke.yml
          git config user.name "Plansul"
          git config user.email "yuritas.pessoal@gmail.com"
          git add .github/workflows/v12-login-smoke.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: remove teste temporário V12"
          git push origin HEAD:v12-login-final-e-acesso
