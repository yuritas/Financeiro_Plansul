name: Apply V4 Code.gs
on:
  push:
    paths:
      - '.v4-codegs-ready'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply patch
        run: python .v4patch.py
      - name: Validate scripts
        run: |
          node --check app.js
          node --check fluxo-v4.js
          node --check fluxo-v4-ui.js
          cp apps-script/Code.gs /tmp/Code-v4.js
          node --check /tmp/Code-v4.js
      - name: Commit result
        run: |
          rm -f .v4-codegs-ready .v4patch.py .github/workflows/apply-v4-codegs.yml apps-script/V4.gs
          git config user.name 'Plansul'
          git config user.email 'yuritas.pessoal@gmail.com'
          git add -A
          git commit -m 'feat: integra backend V4 de aplicações no Code.gs'
          git push origin HEAD:${{ github.ref_name }}
