name: HotfixLogin
on:
  push:
    paths:
      - '.hotfix-login/ready'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix-login-bootstrap-v6
      - run: python3 .hotfix-login/patch.py
      - run: node --check app.js && node --check app-core.js && node --check login-v6.js
      - run: |
          if grep -q 'document.write' app.js; then exit 1; fi
      - run: |
          rm -rf .hotfix-login
          rm -f .github/workflows/hotfix-login-bootstrap.yml
          git config user.name Plansul
          git config user.email yuritas.pessoal@gmail.com
          git add -A
          git commit -m 'fix: libera renderização imediata do login'
          git push origin HEAD:hotfix-login-bootstrap-v6
