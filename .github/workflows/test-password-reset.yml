name: Test Password Reset
on:
  push:
    branches: [feature/esqueci-minha-senha]
permissions:
  contents: write
jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/esqueci-minha-senha
      - name: Testar fluxo de recuperação
        run: node tools/test-password-reset.js
      - name: Remover teste temporário
        run: |
          rm -f tools/test-password-reset.js .github/workflows/test-password-reset.yml
          git config user.name "Plansul"
          git config user.email "yuritas.pessoal@gmail.com"
          git add -A
          git commit -m "chore: remove teste temporário de recuperação"
          git push origin HEAD:feature/esqueci-minha-senha
