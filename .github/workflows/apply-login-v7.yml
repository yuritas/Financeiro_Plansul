name: ApplyLoginV7
on:
  push:
    paths:
      - '.v7payload/ready'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v7-login-profissional-estavel
      - name: Apply validated payload
        shell: bash
        run: |
          cat .v7payload/chunk_*.b64 | base64 -d > /tmp/v7.tgz
          mkdir -p /tmp/v7
          tar -xzf /tmp/v7.tgz -C /tmp/v7
          python3 /tmp/v7/apply_v7.py
          node --check app.js
          node --check app-core.js
          node --check login-v6.js
          grep -q 'PlansulLoginEndpoint' app.js
          grep -q 'return true;' app-core.js
          grep -q 'Acessar o painel' login-v6.css
      - name: Commit final V7
        shell: bash
        run: |
          rm -rf .v7payload
          rm -f .github/workflows/apply-login-v7.yml
          git config user.name 'Plansul'
          git config user.email 'yuritas.pessoal@gmail.com'
          git add app.js app-core.js login-v6.js login-v6.css index.html diretoria.html
          git add -u
          git commit -m 'fix: estabiliza login e aplica layout corporativo V7'
          git push origin HEAD:v7-login-profissional-estavel
