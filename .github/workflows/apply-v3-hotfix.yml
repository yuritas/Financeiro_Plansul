name: Apply V3 calendar hotfix

on:
  push:
    paths:
      - '.v3hotfix/ready'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply calendar hotfix
        shell: bash
        run: |
          set -euo pipefail
          cat .v3hotfix/hf_*.b64 | base64 -d > /tmp/hotfix-calendar.tgz
          echo '4b9a077f262f118c9baf92411a53c836a548cf91534b32994a26ba1d4cfc3356  /tmp/hotfix-calendar.tgz' | sha256sum -c -
          tar -xzf /tmp/hotfix-calendar.tgz -C .
          rm -rf .v3hotfix
          rm -f .github/workflows/apply-v3-hotfix.yml
          node --check tesouraria-v3.js
      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Plansul'
          git config user.email 'yuritas.pessoal@gmail.com'
          git add -A
          git commit -m 'fix: corrige seleção de intervalo e navegação mobile'
          git push origin HEAD:${{ github.ref_name }}
