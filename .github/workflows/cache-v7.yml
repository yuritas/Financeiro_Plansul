name: CacheV7
on:
  push:
    paths:
      - '.cache-v7/ready'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Version frontend assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('index.html','diretoria.html'):
              p=Path(name); s=p.read_text(encoding='utf-8')
              s=s.replace('href="login-v6.css"','href="login-v6.css?v=7"')
              s=s.replace('src="login-v6.js"','src="login-v6.js?v=7"')
              s=s.replace('src="app.js"','src="app.js?v=7"')
              p.write_text(s,encoding='utf-8')
          p=Path('app.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("css.href=href;", "css.href=href+'?v=7';")
          s=s.replace("el.src=src;", "el.src=src+'?v=7';")
          p.write_text(s,encoding='utf-8')
          PY
          node --check app.js
          grep -q 'login-v6.js?v=7' index.html
          grep -q "el.src=src+'?v=7'" app.js
      - name: Commit cache bust
        shell: bash
        run: |
          rm -rf .cache-v7
          rm -f .github/workflows/cache-v7.yml
          git config user.name 'Plansul'
          git config user.email 'yuritas.pessoal@gmail.com'
          git add app.js index.html diretoria.html
          git add -u
          git commit -m 'fix: invalida cache dos assets da V7'
          git push origin HEAD:main
