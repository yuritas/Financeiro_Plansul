name: V12 Finalize
on:
  push:
    branches: [v12-login-final-e-acesso]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v12-login-final-e-acesso
      - name: Aplicar markup final e cache V12
        shell: python
        run: |
          from pathlib import Path
          login = '''<!-- Tela de login -->
          <div id="loginOverlay" data-v12-markup="1" aria-label="Acesso à Tesouraria">
            <section class="login-v8-visual" aria-hidden="true"></section>
            <section class="login-v8-sheet">
              <form class="login-v8-form" id="loginForm" novalidate>
                <div class="login-v8-field">
                  <span class="login-v8-field-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"></circle><path d="M4.5 21v-2.2c0-4.1 3.3-7.3 7.5-7.3s7.5 3.2 7.5 7.3V21"></path></svg></span>
                  <label for="loginUser">Usuário</label>
                  <input type="text" id="loginUser" autocomplete="username" inputmode="text" placeholder="Usuário" required>
                </div>
                <div class="login-v8-field">
                  <span class="login-v8-field-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path><path d="M12 14v3"></path></svg></span>
                  <label for="loginPass">Senha</label>
                  <input type="password" id="loginPass" autocomplete="current-password" placeholder="Senha" required>
                </div>
                <p class="login-v8-message" id="loginError" hidden role="status" aria-live="polite"></p>
                <div class="login-v8-actions">
                  <button type="submit" class="login-v8-submit" id="loginSubmit">Entrar<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13"></path><path d="m14 7 5 5-5 5"></path></svg></button>
                </div>
              </form>
            </section>
          </div>

          '''
          for name in ('index.html','diretoria.html'):
              p=Path(name)
              text=p.read_text(encoding='utf-8')
              start=text.index('<!-- Tela de login -->')
              end=text.index('<div class="app" id="app" hidden>')
              text=text[:start]+login+text[end:]
              for old,new in (
                  ('login-v6.css?v=11','login-v6.css?v=12'),
                  ('login-v6.js?v=11','login-v6.js?v=12'),
                  ('app.js?v=11','app.js?v=12'),
                  ('xlsx-v6-loader.js?v=11','xlsx-v6-loader.js?v=12'),
              ):
                  text=text.replace(old,new)
              p.write_text(text,encoding='utf-8')
      - name: Validar JavaScript e referências
        shell: bash
        run: |
          node --check login-v6.js
          node --check app.js
          node --check dashboard-bridge-v10.js
          grep -q 'login-v6.css?v=12' index.html
          grep -q 'login-v6.js?v=12' index.html
          grep -q 'app.js?v=12' index.html
          grep -q 'assets/login-header-final.webp' login-v8.css
          test -f assets/login-header-final.webp
      - name: Remover workflow temporário e commit
        shell: bash
        run: |
          rm -f .github/workflows/v12-finalize.yml
          git config user.name "Plansul"
          git config user.email "yuritas.pessoal@gmail.com"
          git add index.html diretoria.html login-v6.js app.js login-v6.css login-v8.css login-v10-effects.css assets/login-header-final.webp .github/workflows/v12-finalize.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V12: finaliza login visual e fluxo de acesso"
          git push origin HEAD:v12-login-final-e-acesso
